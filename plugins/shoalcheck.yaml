apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: shoalcheck
spec:
  version: v0.1.2
  homepage: https://shoalcheck.com
  shortDescription: Read-only preflight and audit for your cluster
  description: |
    Shoalcheck answers one change before you make it: which node cannot be
    drained and the object that stops it (a budget at zero, a pod nothing
    recreates, a volume pinned to the node, work with nowhere to go), what
    stops the way to a Kubernetes version, and what losing a zone would
    strand. A full reading lists reliability, security and cost findings,
    each tied to the object it rests on, and is kept so the next reading of
    the same cluster says what changed. What it could not read is reported
    as not read, never as passed.
  caveats: |
    Shoalcheck is read-only: it uses get and list only and never writes to the
    cluster. The exact RBAC it needs can be printed with `audit --show-permissions`.
    A preflight models less than the scheduler: it can say a change will stop,
    not promise that it will succeed. Some commands need a licence; see
    https://shoalcheck.com.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.2/kubectl-shoalcheck_0.1.2_darwin_amd64.tar.gz
    sha256: 7d8d45e38fcc39ff3376856af0d51420f5d4d0d8c62c947ae424b2c203674141
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.2/kubectl-shoalcheck_0.1.2_darwin_arm64.tar.gz
    sha256: 0ad9d719ac11ef03094fdce54599807cb507755ddbdd53b89cbedb57912e187f
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.2/kubectl-shoalcheck_0.1.2_linux_amd64.tar.gz
    sha256: 32c1672200a298a3939bc6efa5c513fe965ffeb7f6ac2b895fd0d7dab90b6eac
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.2/kubectl-shoalcheck_0.1.2_linux_arm64.tar.gz
    sha256: c5be7f1fd3c3948cbbdaf38952b6026dfe0bd84c95a0e2dd40ae363498713d21
    files:
    - from: kubectl-shoalcheck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.2/kubectl-shoalcheck_0.1.2_windows_amd64.zip
    sha256: eab2143a61fd74311449717c77fe3545490d285f7de5b7ada2b5ee56edf3a2c2
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Shoalcheck/shoalcheck/releases/download/v0.1.2/kubectl-shoalcheck_0.1.2_windows_arm64.zip
    sha256: 43cb31a595fe14780fd435e995482ba8d4c13ac92ce7bbfa0247ce91b4c8334d
    files:
    - from: kubectl-shoalcheck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-shoalcheck.exe
